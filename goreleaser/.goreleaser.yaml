# GoReleaser: https://goreleaser.com/
# Run from repo root. Locally: goreleaser check --config goreleaser/.goreleaser.yaml
#
# The release workflow sets: RELEASE_NAME, RELEASE_BODY, GORELEASER_CURRENT_TAG
version: 2

project_name: webui

before:
  hooks:
    - go mod download

builds:
  - id: noop
    skip: true

changelog:
  use: git
  sort: asc
  # A line is the commit's title, which ends in the pull request's number, and GitHub links that. No hash.
  format: '{{ .Message }}'
  filters:
    exclude:
      - '(?i)^merge '
      - '(?i)^merge pull request'
      - "^chore\\(release\\):"
      - '^ci(\(.+\))?!?:'
      - '^docs(\(.+\))?!?:'
      - '^test(\(.+\))?!?:'
  # Matched against the commit's title, in Conventional Commits. A breaking change of any type is the first group, and the others do not match a "!" so
  # that it is in one group only; what no group matches (style, ops, build, chore) is in the last.
  groups:
    - title: Breaking changes
      regexp: '^[a-z]+(\(.+\))?!:'
      order: 0
    - title: Features
      regexp: '^feat(\(.+\))?:'
      order: 1
    - title: Fixes
      regexp: '^fix(\(.+\))?:'
      order: 2
    - title: Performance
      regexp: '^perf(\(.+\))?:'
      order: 3
    - title: Refactoring
      regexp: '^refactor(\(.+\))?:'
      order: 4
    - title: Others
      order: 999

release:
  prerelease: auto
  name_template: '{{ .Env.RELEASE_NAME }}'
  header: |
    {{ .Env.RELEASE_BODY }}

  footer: |
    {{ if .PreviousTag }}
    **Full changelog**: https://github.com/Olian04/webui/compare/{{ .PreviousTag }}...{{ .Tag }}
    {{ end }}
    ## Use as a Go module

    ```bash
    go get github.com/Olian04/webui@{{ .Tag }}
    ```

    Import from `github.com/Olian04/webui/pkg/webui`.
