name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum

      - name: Generate
        run: make generate

      - name: Generated code is committed and up to date
        run: |
          if [ -n "$(git status --porcelain -- '*_templ.go' internal/render/assets/min)" ]; then
            git status --short -- '*_templ.go' internal/render/assets/min
            echo "Run make generate and commit the *_templ.go files and internal/render/assets/min." >&2
            exit 1
          fi

      - name: Build
        run: go build ./...

      - name: Lint
        run: make lint

      - name: Test
        run: make test

  # What the scripts and the stylesheet do, in a browser, against the demo: go test has none to run them in.
  browser:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/e2e/package-lock.json

      - name: Build the demo
        run: go build -o tools/e2e/demo ./cmd/demo

      - name: Install the browser
        working-directory: tools/e2e
        run: npm ci && npx playwright install --with-deps chromium

      - name: Browser suite
        working-directory: tools/e2e
        run: npx playwright test --trace off
