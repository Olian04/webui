name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Generate
        run: make generate

      - name: Generated code is committed and up to date
        run: |
          if [ -n "$(git status --porcelain -- '*_templ.go')" ]; then
            git status --short -- '*_templ.go'
            echo "Run make generate and commit the *_templ.go files." >&2
            exit 1
          fi

      - name: Build
        run: go build ./...

      - name: Lint
        run: make lint

      - name: Test
        run: make test
