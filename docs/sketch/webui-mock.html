<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>webui — UI mock</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ===========================================================================
   Design tokens. In the library these are ir.Theme.Tokens, emitted as a :root
   block; the utility CSS is prebuilt by the Tailwind standalone CLI and
   go:embed-ed. The values below are tuned to Grafana's dark canvas, which is
   a theme choice, not a structural one — the markup underneath is unchanged.
   =========================================================================== */
:root, [data-theme="dark"]{
  color-scheme:dark;
  --canvas:#111217;
  --panel:#181b1f;
  --raise:#22252b;
  --input-bg:#0e0f12;
  --border:rgba(204,204,220,.11);
  --border-2:rgba(204,204,220,.22);
  --text:rgb(204,204,220);
  --text-2:rgba(204,204,220,.65);
  --text-3:rgba(204,204,220,.40);
  --hover:rgba(204,204,220,.07);
  --active:rgba(204,204,220,.11);
  --blue:#3d71d9;  --blue-hover:#5183e4; --blue-text:#6e9fff;
  --green:#6ccf8e; --green-bg:rgba(108,207,142,.14); --green-bd:rgba(108,207,142,.30);
  --orange:#ff9830;--orange-bg:rgba(255,152,48,.14); --orange-bd:rgba(255,152,48,.30);
  --red:#e5484d;   --red-bg:rgba(229,72,77,.14);     --red-bd:rgba(229,72,77,.32);
  --shadow:0 4px 12px rgb(0 0 0/.55);
}
[data-theme="light"]{
  color-scheme:light;
  --canvas:#f4f5f5;
  --panel:#ffffff;
  --raise:#ffffff;
  --input-bg:#ffffff;
  --border:rgba(36,41,46,.12);
  --border-2:rgba(36,41,46,.24);
  --text:#24292e;
  --text-2:#5c6269;
  --text-3:#8e9197;
  --hover:rgba(36,41,46,.06);
  --active:rgba(36,41,46,.10);
  --blue:#3d71d9;  --blue-hover:#3265d4; --blue-text:#1f62e0;
  --green:#1a7f4b; --green-bg:rgba(26,127,75,.12);   --green-bd:rgba(26,127,75,.28);
  --orange:#b5510d;--orange-bg:rgba(181,81,13,.12);  --orange-bd:rgba(181,81,13,.28);
  --red:#cf0e5b;   --red-bg:rgba(207,14,91,.10);     --red-bd:rgba(207,14,91,.26);
  --shadow:0 4px 12px rgb(24 26 27/.18);
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--canvas);color:var(--text);
  font:14px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;
}
a{color:inherit;text-decoration:none}
button,input,select{font:inherit;color:inherit}
svg{stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--border-2);border-radius:9px}
::-webkit-scrollbar-track{background:transparent}

/* ------------------------------ shell ------------------------------------ */
.app{display:flex;min-height:100vh;align-items:stretch}

/* ------------------------------ sidebar ---------------------------------- */
.sidebar{
  width:240px;flex:0 0 240px;background:var(--panel);
  border-right:1px solid var(--border);
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh;
}
.side-brand{
  display:flex;align-items:center;gap:9px;height:48px;padding:0 12px;flex:0 0 48px;
  border-bottom:1px solid var(--border);
}
.logo{
  width:22px;height:22px;flex:0 0 22px;border-radius:99px;
  background:conic-gradient(from 210deg,#ff9830,#f2495c 55%,#ff9830);
  display:grid;place-items:center;
}
.logo span{
  width:9px;height:9px;border-radius:99px;background:var(--panel);
  box-shadow:0 0 0 2px var(--panel);
}
.side-brand b{font-size:14px;font-weight:600;letter-spacing:-.01em}
.side-scroll{flex:1;overflow-y:auto;padding:6px 0 10px}
.nav-section{
  font-size:11px;font-weight:500;letter-spacing:.05em;text-transform:uppercase;
  color:var(--text-3);padding:14px 14px 5px;
}
.nav-item{
  display:flex;align-items:center;gap:10px;height:32px;padding:0 12px;
  font-size:13.5px;color:var(--text-2);cursor:pointer;position:relative;
}
.nav-item:hover{background:var(--hover);color:var(--text)}
.nav-item.active{background:var(--active);color:var(--text);font-weight:500}
.nav-item.active::before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--blue-text)}
.nav-item .ni{width:16px;height:16px;flex:0 0 16px;opacity:.85}
.nav-item .chev{width:13px;height:13px;margin-left:auto;opacity:.6;transition:transform .12s}
.nav-item.open .chev{transform:rotate(180deg)}
.nav-count{
  margin-left:auto;font-size:11px;color:var(--text-3);font-variant-numeric:tabular-nums;
  background:var(--hover);border-radius:9px;padding:1px 6px;
}
.nav-item.active .nav-count{color:var(--text-2)}
.nav-sub{display:none}
.nav-sub.open{display:block}
.nav-sub .nav-item{padding-left:42px;font-size:13px}
.side-foot{border-top:1px solid var(--border);padding:8px 12px 34px}
.side-row{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  font-size:12px;color:var(--text-2);height:26px;
}

/* switch */
.switch{position:relative;display:inline-block;width:30px;height:16px;flex:0 0 30px}
.switch input{opacity:0;width:0;height:0}
.slider{position:absolute;inset:0;background:var(--border-2);border-radius:99px;cursor:pointer;transition:background-color .13s}
.slider::before{
  content:"";position:absolute;height:12px;width:12px;left:2px;top:2px;border-radius:99px;
  background:var(--panel);transition:transform .13s;
}
[data-theme="light"] .slider::before{background:#fff;box-shadow:0 1px 2px rgb(0 0 0/.25)}
.switch input:checked + .slider{background:var(--blue)}
.switch input:checked + .slider::before{transform:translateX(14px)}

/* ------------------------------ main ------------------------------------- */
.main{flex:1;min-width:0;display:flex;flex-direction:column}

/* top bar: breadcrumbs left, actions right (Grafana's app chrome) */
.topbar{
  height:48px;flex:0 0 48px;display:flex;align-items:center;gap:10px;padding:0 12px;
  background:var(--panel);border-bottom:1px solid var(--border);
  position:sticky;top:0;z-index:30;
}
.crumbs{display:flex;align-items:center;gap:6px;font-size:14px;min-width:0}
.crumbs a{color:var(--text-2);white-space:nowrap}
.crumbs a:hover{color:var(--text)}
.crumbs .sep{color:var(--text-3);font-size:12px}
.crumbs .cur{color:var(--text);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-right{margin-left:auto;display:flex;align-items:center;gap:6px}
.search{
  display:flex;align-items:center;gap:8px;height:30px;width:290px;padding:0 9px;
  background:var(--input-bg);border:1px solid var(--border);border-radius:2px;
  color:var(--text-3);font-size:13px;cursor:text;
}
.search input{flex:1;min-width:0;background:none;border:0;outline:none;font-size:13px}
.search input::placeholder{color:var(--text-3)}
.search svg{width:14px;height:14px}
.kbd{
  font:11px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--text-3);
  border:1px solid var(--border);border-radius:2px;padding:0 4px;line-height:15px;
}
.iconbtn{
  width:30px;height:30px;display:grid;place-items:center;border:0;background:none;
  color:var(--text-2);border-radius:2px;cursor:pointer;
}
.iconbtn:hover{background:var(--hover);color:var(--text)}
.iconbtn svg{width:16px;height:16px}
.avatar{
  width:26px;height:26px;border-radius:99px;background:var(--blue);color:#fff;
  display:grid;place-items:center;font-size:11px;font-weight:600;
}

/* command palette */
.palette{
  position:absolute;top:44px;right:12px;width:360px;background:var(--raise);
  border:1px solid var(--border-2);border-radius:2px;box-shadow:var(--shadow);
  padding:4px;display:none;z-index:40;
}
.palette.open{display:block}
.pal-label{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--text-3);padding:7px 9px 4px}
.pal-item{display:flex;align-items:center;gap:9px;height:30px;padding:0 9px;font-size:13px;color:var(--text-2);cursor:pointer;border-radius:2px}
.pal-item:hover{background:var(--hover);color:var(--text)}
.pal-item .mono{margin-left:auto;font-size:11px;color:var(--text-3)}
.pal-empty{padding:12px 9px;font-size:12.5px;color:var(--text-3)}

/* toolbar: page arguments as variable pickers (Grafana's variable bar) */
.toolbar{
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  padding:7px 12px;background:var(--canvas);border-bottom:1px solid var(--border);
  position:sticky;top:48px;z-index:25;min-height:44px;
}
.var{display:flex;align-items:stretch;height:30px}
.var-label{
  display:flex;align-items:center;gap:5px;padding:0 9px;font-size:12.5px;color:var(--text-2);
  background:var(--panel);border:1px solid var(--border);border-right:0;border-radius:2px 0 0 2px;
  white-space:nowrap;
}
.var-label svg{width:12px;height:12px;opacity:.6}
.var-ctl{
  display:flex;align-items:center;gap:7px;padding:0 8px;min-width:96px;
  background:var(--input-bg);border:1px solid var(--border);border-radius:0 2px 2px 0;
  font-size:13px;color:var(--text);cursor:pointer;
}
.var-ctl:hover{border-color:var(--border-2)}
.var-ctl select{
  background:none;border:0;outline:none;font-size:13px;cursor:pointer;flex:1;min-width:0;
  appearance:none;padding-right:14px;
  background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);
  background-position:calc(100% - 6px) 13px,calc(100% - 2px) 13px;background-size:4px 4px,4px 4px;background-repeat:no-repeat;
}
.var-ctl select option{background:var(--panel);color:var(--text)}
.var-ctl input{background:none;border:0;outline:none;font-size:13px;width:150px}
.var-chip{
  display:inline-flex;align-items:center;gap:5px;background:var(--hover);
  border-radius:2px;padding:1px 4px 1px 6px;font-size:12.5px;
}
.var-x{color:var(--text-3);cursor:pointer;font-size:13px;line-height:1}
.var-x:hover{color:var(--text)}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:6px}
.tb-btn{
  display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;
  background:var(--panel);border:1px solid var(--border);border-radius:2px;
  font-size:13px;color:var(--text);cursor:pointer;white-space:nowrap;
}
.tb-btn:hover{background:var(--hover)}
.tb-btn svg{width:14px;height:14px}
.tb-btn.split-l{border-radius:2px 0 0 2px;border-right:0}
.tb-btn.split-r{border-radius:0 2px 2px 0;padding:0 6px}
.noargs{font-size:12.5px;color:var(--text-3);font-style:italic}

/* ------------------------------ content ---------------------------------- */
.scroll{flex:1;overflow:auto;padding:8px 12px 46px}
.scroll.fading{opacity:.35;transition:opacity .09s}

/* Grafana's collapsible row. In webui this is a Stack — which has no Label
   field today; see the note on the Devices page. */
.rowhead{
  display:flex;align-items:center;gap:7px;height:30px;font-size:14px;font-weight:500;
  color:var(--text);cursor:pointer;user-select:none;margin:6px 0 2px;
}
.rowhead svg{width:13px;height:13px;transition:transform .12s;color:var(--text-2)}
.rowhead.closed svg{transform:rotate(-90deg)}
.rowhead .cnt{font-size:12px;color:var(--text-3);font-weight:400}
.rowbody{display:flex;flex-direction:column;gap:8px}
.rowbody.closed{display:none}

/* layouts */
.stack{display:flex;flex-direction:column;gap:8px}
.split{display:grid;grid-template-columns:1fr 1fr;gap:8px;align-items:start}
@media (max-width:1100px){.split{grid-template-columns:1fr}}
.split.w64{grid-template-columns:1.6fr 1fr}

/* tabs — links carrying an argument */
.tabs{display:flex;gap:0;border-bottom:1px solid var(--border);margin:2px 0 8px}
.tab{
  padding:8px 13px;font-size:13.5px;color:var(--text-2);cursor:pointer;
  border-bottom:2px solid transparent;margin-bottom:-1px;
}
.tab:hover{color:var(--text);background:var(--hover)}
.tab.active{color:var(--text);font-weight:500;border-bottom-color:var(--orange)}

/* ------------------------------ panel ------------------------------------ */
.panel{
  background:var(--panel);border:1px solid var(--border);border-radius:2px;
  display:flex;flex-direction:column;min-width:0;
}
.panel-head{
  display:flex;align-items:center;gap:7px;height:32px;padding:0 10px;flex:0 0 32px;
}
.panel-title{
  font-size:14px;font-weight:500;margin:0;color:var(--text);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.panel-head .info{width:13px;height:13px;color:var(--text-3);flex:0 0 13px;cursor:help}
.panel-head .info:hover{color:var(--text-2)}
.panel-status{width:13px;height:13px;flex:0 0 13px}
.panel-status.ok{color:var(--green)}
.panel-menu{margin-left:auto;display:flex;align-items:center;gap:2px;opacity:0;transition:opacity .12s}
.panel:hover .panel-menu{opacity:1}
.panel-menu .iconbtn{width:24px;height:24px}
.panel-menu .iconbtn svg{width:14px;height:14px}
.panel-body{padding:0 0 0;min-width:0}
.panel-body.pad{padding:4px 12px 14px}
.panel-foot{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:7px 10px;border-top:1px solid var(--border);
}

/* ------------------------------ buttons ---------------------------------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  height:32px;padding:0 12px;border-radius:2px;font-size:13.5px;font-weight:500;
  cursor:pointer;white-space:nowrap;border:1px solid transparent;background:none;
  transition:background-color .11s,border-color .11s;
}
.btn svg{width:14px;height:14px}
.btn-primary{background:var(--blue);color:#fff;border-color:var(--blue)}
.btn-primary:hover{background:var(--blue-hover);border-color:var(--blue-hover)}
.btn-secondary{border-color:var(--border-2);color:var(--text)}
.btn-secondary:hover{background:var(--hover)}
.btn-ghost{color:var(--text-2)}
.btn-ghost:hover{background:var(--hover);color:var(--text)}
.btn-danger{background:var(--red);color:#fff;border-color:var(--red)}
.btn-danger:hover{filter:brightness(1.1)}
.btn-sm{height:28px;padding:0 9px;font-size:12.5px}
.btn:disabled,.btn.disabled{opacity:.45;cursor:not-allowed}
.gated{position:relative}
.gated:hover::after{
  content:attr(data-why);position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);
  background:var(--raise);color:var(--text);border:1px solid var(--border-2);font-size:12px;font-weight:400;
  padding:5px 8px;border-radius:2px;white-space:nowrap;z-index:50;pointer-events:none;box-shadow:var(--shadow);
}

/* ------------------------------ table ------------------------------------ */
table{width:100%;border-collapse:collapse;font-size:13px}
thead th{
  text-align:left;font-weight:500;font-size:12.5px;color:var(--text-2);
  height:30px;padding:0 10px;background:var(--hover);white-space:nowrap;
  border-bottom:1px solid var(--border);position:sticky;top:0;
}
thead th.num{text-align:right}
thead th a{display:inline-flex;align-items:center;gap:4px;cursor:pointer}
thead th a:hover{color:var(--text)}
thead th.sorted a{color:var(--blue-text)}
.caret{width:11px;height:11px;opacity:.9}
tbody tr{border-bottom:1px solid var(--border)}
tbody tr:last-child{border-bottom:0}
tbody tr.clickable{cursor:pointer}
tbody tr:hover{background:var(--hover)}
tbody tr.selected{background:rgba(61,113,217,.13)}
tbody td{padding:0 10px;height:34px;vertical-align:middle}
tbody td.num{text-align:right;font-variant-numeric:tabular-nums}
td.pick,th.pick{width:34px;padding-right:0}
.mono{font:12.5px ui-monospace,SFMono-Regular,Menlo,monospace}
.dim{color:var(--text-2)}
.checkbox{
  appearance:none;width:15px;height:15px;border:1px solid var(--border-2);border-radius:2px;
  background:var(--input-bg);cursor:pointer;display:grid;place-content:center;
}
.checkbox:checked{background:var(--blue);border-color:var(--blue)}
.checkbox:checked::after{
  content:"";width:9px;height:9px;background:#fff;
  clip-path:polygon(14% 44%,0 65%,50% 100%,100% 16%,80% 0%,43% 62%);
}
.actionbar{
  display:flex;align-items:center;gap:9px;padding:6px 10px;font-size:12.5px;
  background:rgba(61,113,217,.10);border-bottom:1px solid var(--border);
}
.pager{display:flex;align-items:center;gap:6px}
.pager-info{font-size:12.5px;color:var(--text-2);font-variant-numeric:tabular-nums}
.empty{padding:44px 16px;text-align:center}
.empty svg{width:28px;height:28px;color:var(--text-3);margin-bottom:9px}
.empty-title{font-weight:500;margin-bottom:3px;font-size:13.5px}
.empty-desc{font-size:12.5px;color:var(--text-3)}
.skel-row td{height:34px}
.skel{height:9px;border-radius:2px;background:var(--hover);animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

/* sparkline-ish inline bar, purely a cell renderer */
.gauge{display:flex;align-items:center;gap:7px;justify-content:flex-end}
.gauge-track{width:56px;height:5px;border-radius:2px;background:var(--hover);overflow:hidden;flex:0 0 56px}
.gauge-fill{display:block;height:100%;border-radius:2px;background:var(--blue-text)}

/* ------------------------------ badges ----------------------------------- */
.badge{
  display:inline-flex;align-items:center;gap:5px;height:19px;padding:0 7px;border-radius:2px;
  font-size:11.5px;font-weight:500;border:1px solid transparent;text-transform:lowercase;
}
.badge-ok{background:var(--green-bg);color:var(--green);border-color:var(--green-bd)}
.badge-warn{background:var(--orange-bg);color:var(--orange);border-color:var(--orange-bd)}
.badge-bad{background:var(--red-bg);color:var(--red);border-color:var(--red-bd)}
.badge-mute{background:var(--hover);color:var(--text-2);border-color:var(--border)}
.dot{width:6px;height:6px;border-radius:99px;background:currentColor}

/* ------------------------------ form ------------------------------------- */
.field{margin-bottom:14px}
.field:last-child{margin-bottom:0}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:760px){.field-row{grid-template-columns:1fr}}
label.lbl{display:flex;align-items:center;gap:5px;font-size:12.5px;font-weight:500;margin-bottom:5px;color:var(--text)}
.req{color:var(--red)}
.input,select.input{
  width:100%;height:32px;padding:0 9px;font-size:13.5px;
  background:var(--input-bg);color:var(--text);
  border:1px solid var(--border-2);border-radius:2px;outline:none;
  transition:border-color .11s,box-shadow .11s;
}
.input::placeholder{color:var(--text-3)}
.input:focus{border-color:var(--blue);box-shadow:0 0 0 2px rgb(61 113 217/.25)}
select.input{
  appearance:none;padding-right:26px;
  background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);
  background-position:calc(100% - 15px) 14px,calc(100% - 11px) 14px;background-size:4px 4px,4px 4px;background-repeat:no-repeat;
}
select.input option{background:var(--panel);color:var(--text)}
.input[readonly]{background:var(--hover);color:var(--text-2);border-color:var(--border);cursor:not-allowed}
.input.invalid{border-color:var(--red)}
.input.invalid:focus{box-shadow:0 0 0 2px rgb(229 72 77/.25)}
.hint{font-size:12px;color:var(--text-3);margin-top:5px}
.hint code,.note code{font:11.5px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--text-2)}
.err{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--red);margin-top:5px}
.err svg{width:13px;height:13px;flex:0 0 13px}
.group{border:1px solid var(--border);border-radius:2px;padding:12px;margin-bottom:14px}
.group-legend{
  font-size:11px;font-weight:500;letter-spacing:.05em;text-transform:uppercase;
  color:var(--text-3);margin-bottom:11px;
}

/* ------------------------------ toast ------------------------------------ */
.toasts{position:fixed;right:14px;bottom:36px;z-index:60;display:flex;flex-direction:column;gap:8px}
.toast{
  display:flex;align-items:flex-start;gap:10px;background:var(--raise);
  border:1px solid var(--border-2);border-left:3px solid var(--green);border-radius:2px;
  box-shadow:var(--shadow);padding:10px 13px;min-width:290px;animation:pop .16s ease-out;
}
.toast.err{border-left-color:var(--red)}
@keyframes pop{from{opacity:0;transform:translateY(6px)}}
.toast.out{opacity:0;transform:translateY(6px);transition:opacity .2s,transform .2s}
.toast-title{font-size:13.5px;font-weight:500}
.toast-desc{font-size:12.5px;color:var(--text-2);margin-top:2px}

/* ------------------------------ states ----------------------------------- */
.state-page{max-width:480px;margin:72px auto;text-align:center}
.state-page svg{width:34px;height:34px;color:var(--text-3);margin-bottom:12px}
.state-title{font-size:17px;font-weight:600;margin:0 0 5px}
.state-desc{color:var(--text-2);margin:0 0 16px;font-size:13.5px}
.compile{max-width:840px;margin:8px auto 0}
.compile h2{color:var(--red);font-size:22px;font-weight:600;margin:0 0 3px}
.compile .count{color:var(--text-2);margin:0 0 20px;font-size:13.5px}
.compile section{margin-bottom:14px}
.compile .where{font:11.5px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--text-3);margin-bottom:5px}
.compile pre{
  margin:0;padding:11px 13px;background:var(--red-bg);border-left:3px solid var(--red);
  border-radius:2px;font:12.5px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--red);
  white-space:pre-wrap;overflow-x:auto;
}
.compile .fix{margin:8px 0 0;font-size:13px;color:var(--text-2)}
.compile .fix b{color:var(--text);font-weight:600}

/* ------------------------------ note strip ------------------------------- */
.note{
  margin-top:10px;border:1px solid var(--border);border-left:3px solid var(--blue);
  border-radius:2px;padding:11px 13px;font-size:12.5px;color:var(--text-2);background:var(--panel);
}
.note b{color:var(--text);font-weight:500}
.note p{margin:0 0 5px}
.note p:last-child{margin:0}
.note .flag{color:var(--orange)}

/* ------------------------------ status bar ------------------------------- */
.statusbar{
  position:fixed;left:0;right:0;bottom:0;height:26px;z-index:35;
  display:flex;align-items:center;gap:9px;padding:0 12px;
  background:var(--panel);border-top:1px solid var(--border);
  font:11.5px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--text-3);
}
.method{border:1px solid var(--border-2);border-radius:2px;padding:0 5px;font-size:10px;letter-spacing:.04em}
.url{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text-2)}
.netlog{margin-left:auto;display:flex;align-items:center;gap:6px;opacity:0;transition:opacity .18s}
.netlog.on{opacity:1}
.spin{
  width:10px;height:10px;border:1.5px solid var(--border-2);border-top-color:var(--blue-text);
  border-radius:99px;animation:sp .7s linear infinite;
}
@keyframes sp{to{transform:rotate(360deg)}}

@media (max-width:820px){
  .sidebar{width:56px;flex:0 0 56px}
  .side-brand b,.nav-section,.nav-item span,.nav-count,.nav-item .chev,.side-row span{display:none}
  .nav-item{justify-content:center;padding:0}
  .nav-sub{display:none!important}
  .search{display:none}
  .split.w64{grid-template-columns:1fr}
}
</style>
</head>
<body>

<div class="app">
  <aside class="sidebar">
    <div class="side-brand">
      <div class="logo"><span></span></div>
      <b>Collector</b>
    </div>
    <div class="side-scroll" id="nav"></div>
    <div class="side-foot">
      <div class="side-row"><span>Role: editor</span>
        <label class="switch"><input type="checkbox" id="role-sw" checked><span class="slider"></span></label></div>
      <div class="side-row"><span>JavaScript</span>
        <label class="switch"><input type="checkbox" id="js-sw" checked><span class="slider"></span></label></div>
      <div class="side-row"><span>Light theme</span>
        <label class="switch"><input type="checkbox" id="theme-sw"><span class="slider"></span></label></div>
      <div class="side-row"><span>Break app</span>
        <label class="switch"><input type="checkbox" id="broken-sw"><span class="slider"></span></label></div>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <nav class="crumbs" id="crumbs"></nav>
      <div class="top-right">
        <div class="search" id="search">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.4-3.4"/></svg>
          <input id="q-global" placeholder="Search…" autocomplete="off">
          <span class="kbd">&#8984;K</span>
        </div>
        <button class="iconbtn" id="help-btn" title="Every page, argument and rule is declared in Go">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 3.2 2.4c-.7.2-.7.8-.7 1.3M12 17h.01"/></svg>
        </button>
        <div class="avatar">OL</div>
      </div>
      <div class="palette" id="palette"></div>
    </header>

    <div class="toolbar" id="toolbar"></div>
    <div class="scroll" id="content"></div>
  </div>
</div>

<div class="statusbar">
  <span class="method" id="m">GET</span>
  <span class="url" id="u">/admin/device</span>
  <span class="netlog" id="net"><span class="spin"></span><span id="netmsg"></span></span>
</div>
<div class="toasts" id="toasts"></div>

<script>
/* ===========================================================================
   A stand-in for the compiled runtime. It shows WHEN things happen over HTTP,
   not how they are implemented: pages declare one argument struct, a guard
   runs before anything loads, leaves load independently, and every control is
   a real link so the no-JS path is whole-page navigation.
   =========================================================================== */

const sleep = ms => new Promise(r => setTimeout(r, ms));
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $ = s => document.querySelector(s);

/* icons */
const I = {
  info:   '<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/>',
  kebab:  '<circle cx="12" cy="5" r="1.4" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.4" fill="currentColor" stroke="none"/><circle cx="12" cy="19" r="1.4" fill="currentColor" stroke="none"/>',
  refresh:'<path d="M21 12a9 9 0 1 1-2.6-6.4M21 3v6h-6"/>',
  chev:   '<path d="M6 9l6 6 6-6"/>',
  ok:     '<circle cx="12" cy="12" r="9"/><path d="M8.5 12.5l2.5 2.5 4.5-5"/>',
  search: '<circle cx="11" cy="11" r="7"/><path d="M20 20l-3.4-3.4"/>',
  alert:  '<circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/>',
  lock:   '<rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/>',
};
const svg = (d, cls='') => `<svg class="${cls}" viewBox="0 0 24 24">${d}</svg>`;

/* ---------------------------------- data --------------------------------- */
const rnd = (a,b) => a + Math.floor(Math.random()*(b-a));
const DEVICES = Array.from({length:37}, (_,i) => {
  const count = rnd(12, 2400), dur = rnd(30, 90);
  return {
    id: 'dev_' + (0x100000 + i*0x1d3f7).toString(16).slice(0,6),
    ip: `10.0.${4 + (i % 5)}.${rnd(2,250)}`,
    count, duration: dur, rate: +(count/dur).toFixed(2),
    status: count > 1500 ? 'healthy' : count > 400 ? 'degraded' : 'quiet',
    site: ['Stockholm','Malmö','Göteborg'][i % 3],
  };
});
const MAXRATE = Math.max(...DEVICES.map(d => d.rate));
const TAKEN_IPS = new Set(['10.0.4.17','10.0.5.99']);
const ALERTS = Array.from({length:14}, (_,i) => ({
  id: 'alr_' + (1000+i),
  device: DEVICES[i % DEVICES.length].id,
  severity: ['critical','warning','info'][i % 3],
  message: ['Packet loss above threshold','Rate dropped to zero','Firmware behind by 2 versions','Clock drift detected'][i % 4],
  ack: i % 5 === 0,
}));
const eventsFor = id => Array.from({length: 7}, (_,i) => ({
  at: `12:${String(40 - i*3).padStart(2,'0')}`,
  kind: ['report','handshake','retry','report','report','handshake','report'][i],
  detail: ['ok','ok','timeout after 2s','ok','ok','ok','ok'][i],
}));

const state = { role:'editor', js:true, broken:false, selection:new Set(), devices:DEVICES.slice(), closed:new Set() };

/* ------------------------------ URL handling ----------------------------- */
// One argument struct per page. Fields named in the path are path segments;
// the rest are query parameters. A zero value is absent and stays out.
function parseURL(){
  const raw = location.hash.replace(/^#/,'') || '/device';
  const [path, qs] = raw.split('?');
  const args = Object.fromEntries(new URLSearchParams(qs || ''));
  return { path, args };
}
function buildURL(path, args){
  const q = new URLSearchParams();
  Object.entries(args).forEach(([k,v]) => { if(v !== '' && v != null && v !== false) q.set(k, v); });
  const s = q.toString();
  return '#' + path + (s ? '?' + s : '');
}
function here(patch){
  const { path, args } = parseURL();
  return buildURL(path, { ...args, ...patch });
}

/* -------------------------------- routes --------------------------------- */
const ROUTES = [
  { path:'/device',             nav:'devices',   title:'Devices' },
  { path:'/device/:id',         nav:'devices',   title:'Device', shadow:true },
  { path:'/alert',              nav:'alerts',    title:'Alerts' },
  { path:'/settings',           nav:'ingest',    title:'Ingest',    group:'Settings' },
  { path:'/settings/retention', nav:'retention', title:'Retention', group:'Settings' },
];
function match(path){
  for(const r of ROUTES){
    if(!r.path.includes(':')){ if(r.path === path) return { route:r, params:{} }; continue; }
    const a = r.path.split('/'), b = path.split('/');
    if(a.length !== b.length) continue;
    const params = {}; let ok = true;
    a.forEach((seg,i) => { if(seg.startsWith(':')) params[seg.slice(1)] = b[i]; else if(seg !== b[i]) ok = false; });
    if(ok) return { route:r, params };
  }
  return null;
}

/* ------------------------------ guards ----------------------------------- */
const canEdit = () => state.role === 'editor';
const GUARD_WHY = 'Requires the editor role';

/* ------------------------------ sidebar ---------------------------------- */
const NAV = [
  { section:'Platform' },
  { id:'devices', label:'Devices', path:'/device', count:()=>state.devices.length,
    icon:'<rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/>' },
  { id:'alerts', label:'Alerts', path:'/alert', count:()=>ALERTS.filter(a=>!a.ack).length,
    icon:'<path d="M12 3a6 6 0 0 0-6 6c0 5-2 6-2 6h16s-2-1-2-6a6 6 0 0 0-6-6zM10.3 20a2 2 0 0 0 3.4 0"/>' },
  { section:'Configuration' },
  { id:'settings-group', label:'Settings', group:true,
    icon:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9M4.6 9a1.7 1.7 0 0 0-.3-1.9M12 3v2M12 19v2M4.2 7.5l1.7 1M18.1 15.5l1.7 1M4.2 16.5l1.7-1M18.1 8.5l1.7-1"/>',
    children:[ {id:'ingest', label:'Ingest', path:'/settings'},
               {id:'retention', label:'Retention', path:'/settings/retention'} ] },
];
function renderNav(active){
  const inGroup = g => g.children.some(c => c.id === active);
  $('#nav').innerHTML = NAV.map(n => {
    if(n.section) return `<div class="nav-section">${n.label || n.section}</div>`;
    if(n.group){
      const open = inGroup(n);
      return `<div class="nav-item ${open?'open':''}" data-group="${n.id}">
          ${svg(n.icon,'ni')}<span>${n.label}</span>${svg(I.chev,'chev')}
        </div>
        <div class="nav-sub ${open?'open':''}" data-sub="${n.id}">${
          n.children.map(c => `<a class="nav-item ${c.id===active?'active':''}" href="#${c.path}"><span>${c.label}</span></a>`).join('')
        }</div>`;
    }
    const c = n.count ? n.count() : null;
    return `<a class="nav-item ${n.id===active?'active':''}" href="#${n.path}">
      ${svg(n.icon,'ni')}<span>${n.label}</span>${c!=null?`<span class="nav-count">${c}</span>`:''}</a>`;
  }).join('');
}

/* ------------------------------ breadcrumbs ------------------------------ */
function renderCrumbs(route, params){
  const parts = [['Collector', '#/device']];
  if(route.group) parts.push([route.group, null]);
  if(route.path === '/device/:id'){ parts.push(['Devices','#/device']); parts.push([params.id, null]); }
  else parts.push([route.title, null]);
  $('#crumbs').innerHTML = parts.map(([label, href], i) => {
    const last = i === parts.length - 1;
    const el = href && !last ? `<a href="${href}">${esc(label)}</a>`
      : last ? `<span class="cur">${esc(label)}</span>` : `<a>${esc(label)}</a>`;
    return (i ? `<span class="sep">&rsaquo;</span>` : '') + el;
  }).join('');
}

/* --------------------- page arguments as a variable bar ------------------ */
// Grafana's variable row is exactly what a page's Args struct is: named values
// that live in the URL, survive reload and sharing, and reload what depends on
// them. So the toolbar is generated from the argument list, not hand-placed.
const VARS = {
  '/device': [
    { name:'site',   label:'Site',   kind:'select', options:['Stockholm','Malmö','Göteborg'], all:'All' },
    { name:'status', label:'Status', kind:'select', options:['healthy','degraded','quiet'],   all:'All' },
    { name:'q',      label:'Filter', kind:'text',   placeholder:'id, ip or site…' },
  ],
  '/device/:id': [
    { name:'tab', label:'Tab', kind:'select', options:['overview','raw'], all:'overview' },
  ],
  '/alert': [
    { name:'sev',   label:'Severity', kind:'select', options:['critical','warning','info'],  all:'All' },
    { name:'state', label:'State',    kind:'select', options:['open','acknowledged'],        all:'All' },
  ],
  '/settings': [],
  '/settings/retention': [],
};
function renderToolbar(route, args){
  const vars = VARS[route.path] || [];
  const pills = vars.map(v => {
    const val = args[v.name] || '';
    const ctl = v.kind === 'select'
      ? `<select data-var="${v.name}">
           <option value="">${esc(v.all)}</option>
           ${v.options.map(o=>`<option ${val===o?'selected':''}>${esc(o)}</option>`).join('')}
         </select>`
      : `<input data-var="${v.name}" value="${esc(val)}" placeholder="${esc(v.placeholder||'')}">`;
    return `<div class="var">
      <span class="var-label">${esc(v.label)}${svg(I.info)}</span>
      <div class="var-ctl">${ctl}${val?`<span class="var-x" data-clear="${v.name}">&times;</span>`:''}</div>
    </div>`;
  }).join('');

  const dirty = vars.some(v => args[v.name]);
  $('#toolbar').innerHTML = (pills || `<span class="noargs">This page declares no arguments.</span>`) +
    `<div class="tb-right">
      ${dirty ? `<a class="tb-btn" href="${buildURL(parseURL().path, {})}">Clear all</a>` : ''}
      <button class="tb-btn split-l" data-act="refresh-page">${svg(I.refresh)}Refresh</button>
      <button class="tb-btn split-r" data-act="refresh-menu">${svg(I.chev)}</button>
    </div>`;
}

function setURLBar(method, url, note){
  $('#m').textContent = method; $('#u').textContent = '/admin' + url;
  if(note){ $('#netmsg').textContent = note; $('#net').classList.add('on'); }
  else $('#net').classList.remove('on');
}
function toast(title, desc, kind){
  const el = document.createElement('div');
  el.className = 'toast' + (kind==='err'?' err':'');
  el.innerHTML = `<div><div class="toast-title">${esc(title)}</div>${desc?`<div class="toast-desc">${esc(desc)}</div>`:''}</div>`;
  $('#toasts').appendChild(el);
  setTimeout(() => { el.classList.add('out'); setTimeout(()=>el.remove(), 220); }, 3400);
}

/* ------------------------------ panel chrome ----------------------------- */
function panel(o){
  return `<div class="panel" data-leaf="${o.leaf||''}">
    <div class="panel-head">
      <h2 class="panel-title">${esc(o.title)}</h2>
      ${o.desc ? `<svg class="info" viewBox="0 0 24 24"><title>${esc(o.desc)}</title>${I.info}</svg>` : ''}
      ${o.ok ? `<svg class="panel-status ok" viewBox="0 0 24 24"><title>Loaded</title>${I.ok}</svg>` : ''}
      <div class="panel-menu">${o.actions||''}
        <button class="iconbtn" data-act="panel-menu" data-leaf="${o.leaf||''}">${svg(I.kebab)}</button>
      </div>
    </div>
    ${o.body}
    ${o.foot ? `<div class="panel-foot">${o.foot}</div>` : ''}
  </div>`;
}
function row(id, label, count, inner){
  const closed = state.closed.has(id);
  return `<div class="rowhead ${closed?'closed':''}" data-row="${id}">${svg(I.chev)}${esc(label)}
      ${count!=null?`<span class="cnt">${count}</span>`:''}</div>
    <div class="rowbody ${closed?'closed':''}" data-rowbody="${id}">${inner}</div>`;
}

/* ------------------------------ cell renderers --------------------------- */
const caretSVG = dir => `<svg class="caret" viewBox="0 0 24 24"><path d="${dir==='asc'?'M6 15l6-6 6 6':'M6 9l6 6 6-6'}"/></svg>`;
const statusBadge = s => s==='healthy' ? `<span class="badge badge-ok"><span class="dot"></span>healthy</span>`
  : s==='degraded' ? `<span class="badge badge-warn"><span class="dot"></span>degraded</span>`
  : `<span class="badge badge-mute"><span class="dot"></span>quiet</span>`;
const sevBadge = s => s==='critical' ? `<span class="badge badge-bad">critical</span>`
  : s==='warning' ? `<span class="badge badge-warn">warning</span>`
  : `<span class="badge badge-mute">info</span>`;
// A column render hint, not a new node kind: the cell is still one field value.
const gauge = (v, max) => `<span class="gauge"><span>${v.toFixed(2)}</span>
  <span class="gauge-track"><span class="gauge-fill" style="width:${Math.max(3,Math.round(v/max*100))}%"></span></span></span>`;

function skeletonRows(cols, n=6){
  return Array.from({length:n},()=>`<tr class="skel-row">${
    Array.from({length:cols},(_,i)=>`<td><div class="skel" style="width:${[70,55,40,35,50,60][i%6]}%"></div></td>`).join('')
  }</tr>`).join('');
}

/* ------------------------------ leaves ----------------------------------- */
function devicesTable(args){
  const sort = args.sort || 'count', dir = args.dir || 'desc';
  const offset = +(args.offset || 0), size = 10;
  const q = (args.q || '').toLowerCase();

  let rows = state.devices.filter(d =>
    (!q || d.id.includes(q) || d.ip.includes(q) || d.site.toLowerCase().includes(q)) &&
    (!args.site || d.site === args.site) &&
    (!args.status || d.status === args.status));
  rows.sort((a,b) => (a[sort] > b[sort] ? 1 : a[sort] < b[sort] ? -1 : 0) * (dir==='asc'?1:-1));
  const total = rows.length;
  const page = rows.slice(offset, offset + size);

  const th = (key, label, cls='') => {
    const on = sort === key;
    return `<th class="${cls}${on?' sorted':''}">
      <a href="${here({sort:key, dir: on && dir==='desc' ? 'asc':'desc', offset:0})}">${label}${on?caretSVG(dir):''}</a></th>`;
  };

  const body = page.length ? page.map(d => `
    <tr class="clickable" data-href="#/device/${d.id}">
      <td class="mono dim">${d.id}</td>
      <td class="mono">${d.ip}</td>
      <td>${statusBadge(d.status)}</td>
      <td class="dim">${esc(d.site)}</td>
      <td class="num">${d.count.toLocaleString()}</td>
      <td class="num">${gauge(d.rate, MAXRATE)}</td>
    </tr>`).join('')
    : `<tr><td colspan="6"><div class="empty">
         ${svg(I.search)}
         <div class="empty-title">No devices match the current arguments</div>
         <div class="empty-desc">Clear them in the toolbar to see all ${state.devices.length}.</div>
       </div></td></tr>`;

  return panel({
    leaf:'devices', title:'Devices', ok:true,
    desc:'One Table leaf. Sort, page and row links are all URLs; it reloads on its own when an argument it reads changes.',
    body:`<div class="panel-body">
      <table>
        <thead><tr>
          ${th('id','ID')}${th('ip','IP')}${th('status','Status')}${th('site','Site')}
          ${th('count','Occurrences','num')}${th('rate','Rate / s','num')}
        </tr></thead>
        <tbody>${body}</tbody>
      </table></div>`,
    foot:`<div class="pager-info">${total ? `${offset+1}–${Math.min(offset+size,total)} of ${total}` : 'No results'}</div>
      <div class="pager">
        ${offset > 0
          ? `<a class="btn btn-secondary btn-sm" href="${here({offset: Math.max(0, offset-size)})}">Previous</a>`
          : `<span class="btn btn-secondary btn-sm disabled">Previous</span>`}
        ${offset + size < total
          ? `<a class="btn btn-secondary btn-sm" href="${here({offset: offset+size})}">Next</a>`
          : `<span class="btn btn-secondary btn-sm disabled">Next</span>`}
      </div>`,
  });
}

function alertsTable(args){
  const sel = state.selection;
  const rows = ALERTS.filter(a => (!args.sev || a.severity === args.sev) &&
    (!args.state || (args.state === 'acknowledged' ? a.ack : !a.ack)));
  const bar = sel.size ? `<div class="actionbar">
      <strong>${sel.size} selected</strong><span class="dim">&middot;</span>
      <button class="btn btn-sm btn-secondary ${canEdit()?'':'disabled gated'}" ${canEdit()?'':`data-why="${GUARD_WHY}"`} data-act="ack">Acknowledge</button>
      <button class="btn btn-sm btn-danger ${canEdit()?'':'disabled gated'}" ${canEdit()?'':`data-why="${GUARD_WHY}"`} data-act="dismiss">Dismiss</button>
      <a class="btn btn-sm btn-ghost" style="margin-left:auto" href="#" data-act="clearsel">Clear</a>
    </div>` : '';

  return panel({
    leaf:'alerts', title:'Alerts', ok:true,
    desc:'Declares BulkActions, so it gets checkboxes and an action bar. The devices table declares none and gets neither.',
    body:`${bar}<div class="panel-body">
      <table>
        <thead><tr>
          <th class="pick"><input class="checkbox" type="checkbox" id="pickall" ${sel.size===rows.length&&rows.length?'checked':''}></th>
          <th style="width:110px">Severity</th><th style="width:150px">Device</th><th>Message</th><th style="width:140px">State</th>
        </tr></thead>
        <tbody>${rows.length ? rows.map(a => `
          <tr class="${sel.has(a.id)?'selected':''}">
            <td class="pick"><input class="checkbox pick1" type="checkbox" value="${a.id}" ${sel.has(a.id)?'checked':''}></td>
            <td>${sevBadge(a.severity)}</td>
            <td class="mono dim">${a.device}</td>
            <td>${esc(a.message)}</td>
            <td>${a.ack?'<span class="badge badge-mute">acknowledged</span>':'<span class="badge badge-warn">open</span>'}</td>
          </tr>`).join('') : `<tr><td colspan="5"><div class="empty">${svg(I.ok)}
            <div class="empty-title">Nothing matches</div>
            <div class="empty-desc">Clear the severity or state argument.</div></div></td></tr>`}
        </tbody>
      </table></div>`,
  });
}

function deviceForm(d, fieldErr){
  const ipErr = fieldErr && fieldErr.field === 'ip' ? fieldErr.message : null;
  return panel({
    leaf:'form', title:'Configuration',
    desc:'A Form leaf. Fields whose accessor declares no Store render read-only.',
    body:`<form id="device-form" novalidate><div class="panel-body pad">
        <div class="group">
          <div class="group-legend">Identity</div>
          <div class="field-row">
            <div class="field">
              <label class="lbl" for="f-id">ID</label>
              <input class="input mono" id="f-id" value="${esc(d.id)}" readonly>
              <div class="hint">Read-only — the accessor declares no <code>Store</code>.</div>
            </div>
            <div class="field">
              <label class="lbl" for="f-ip">IP <span class="req">*</span></label>
              <input class="input mono ${ipErr?'invalid':''}" id="f-ip" name="ip" value="${esc(d.ip)}"
                     required minlength="7" maxlength="15" pattern="^\\d{1,3}(\\.\\d{1,3}){3}$"
                     ${ipErr?'aria-invalid="true"':''}>
              ${ipErr
                ? `<div class="err">${svg(I.alert)}${esc(ipErr)}</div>`
                : `<div class="hint">IPv4, from the <code>Pattern</code> rule. Try <code>10.0.4.17</code> for a server-side rejection.</div>`}
            </div>
          </div>
        </div>
        <div class="field-row">
          <div class="field">
            <label class="lbl" for="f-site">Site</label>
            <select class="input" id="f-site" name="site">
              ${['Stockholm','Malmö','Göteborg'].map(s=>`<option ${d.site===s?'selected':''}>${s}</option>`).join('')}
            </select>
          </div>
          <div class="field">
            <label class="lbl" for="f-rate">Rate / s</label>
            <input class="input" id="f-rate" value="${d.rate.toFixed(2)}" readonly>
            <div class="hint">Derived from occurrences &divide; duration.</div>
          </div>
        </div>
      </div>
      <div class="panel-foot" style="justify-content:flex-end">
        <a class="btn btn-ghost" href="#/device">Cancel</a>
        <button class="btn btn-primary ${canEdit()?'':'disabled gated'}" ${canEdit()?'':`disabled data-why="${GUARD_WHY}"`} type="submit">Save</button>
      </div></form>`,
  });
}

function eventsPanel(d){
  return panel({
    leaf:'events', title:'Recent events', ok:true,
    desc:'A Table of a different model, beside the form. Split constrains nothing about what its children are about.',
    actions:`<button class="iconbtn" data-act="refresh-events" title="Refresh this leaf">${svg(I.refresh)}</button>`,
    body:`<div class="panel-body"><table>
      <thead><tr><th style="width:70px">Time</th><th style="width:110px">Kind</th><th>Detail</th></tr></thead>
      <tbody>${eventsFor(d.id).map(e=>`<tr>
        <td class="mono dim">${e.at}</td><td>${e.kind}</td>
        <td class="${e.detail==='ok'?'dim':''}">${e.detail==='ok'?'ok':`<span style="color:var(--red)">${esc(e.detail)}</span>`}</td>
      </tr>`).join('')}</tbody></table></div>`,
  });
}

function rawPanel(d){
  return panel({
    leaf:'raw', title:'Raw', desc:'The model as the loader returned it.',
    body:`<div class="panel-body pad"><pre style="margin:0;font:12px/1.6 ui-monospace,Menlo,monospace;color:var(--text-2);white-space:pre-wrap">${
      esc(JSON.stringify({id:d.id, ip:d.ip, site:d.site, occurrences:d.count, duration_s:d.duration, rate:d.rate, status:d.status}, null, 2))
    }</pre></div>`,
  });
}

/* ------------------------------ pages ------------------------------------ */
const NOTE = html => `<div class="note">${html}</div>`;

function pageDevices(args){
  return row('overview', 'Overview', `${state.devices.length} devices`,
    `<div class="stack">${devicesTable(args)}</div>`) +
    NOTE(`
      <p><b>The toolbar is the page's <code>Args</code> struct.</b> Grafana's variable row and a webui page argument are the same idea: a named value that lives in the URL, survives reload and sharing, and reloads whatever reads it. So the bar is generated from the argument list — nothing is placed by hand.</p>
      <p><b>Sort headers, the pager and every row are real links.</b> Turn JavaScript off in the sidebar: they still work, the page just reloads whole instead of swapping one panel.</p>
      <p class="flag"><b>Three things here the IR cannot express today.</b> Panel titles and descriptions — <code>ir.Form</code> and <code>ir.Table</code> have no <code>Title</code>. The collapsible <b>Overview</b> row — <code>ir.Stack</code> has no <code>Label</code>. And the bar in the Rate column — that one is small, a render hint on <code>ir.Field</code>, not a new node kind.</p>`);
}

function pageDevice(d, args, fieldErr){
  const tab = args.tab || 'overview';
  const tabs = [['overview','Overview'],['raw','Raw']];
  return `<div class="tabs">${tabs.map(([k,l]) =>
      `<a class="tab ${tab===k?'active':''}" href="${here({tab: k==='overview'?'':k})}">${l}</a>`).join('')}</div>
    ${tab==='overview'
      ? `<div class="split w64">${deviceForm(d, fieldErr)}${eventsPanel(d)}</div>`
      : rawPanel(d)}
    ${NOTE(`
      <p><b>The sidebar still shows Devices as active.</b> This page declares <code>Nav.Shadow</code>, so it highlights another entry rather than adding one — the breadcrumb carries the position instead.</p>
      <p><b>Tabs are links carrying a <code>tab</code> argument</b>, so the toolbar shows it as a variable. A tab is shareable, survives reload and degrades without JavaScript.</p>
      <p><b>Save with IP <code>10.0.4.17</code></b> to see a rejection no rule can catch — uniqueness needs the service, so it comes back as <code>Effect.Fields</code> with a nil error and the panel re-renders with what you typed.</p>`)}`;
}

function pageAlerts(args){
  return row('alerts-row', 'Alerts', `${ALERTS.filter(a=>!a.ack).length} open`,
    `<div class="stack">${alertsTable(args)}</div>`) +
    NOTE(`
      <p><b>Flip the role switch to viewer.</b> The bulk actions grey out with a reason — the same <code>Guard</code> that would reject the request gates the control, so there is no second authorisation rule to keep in sync.</p>
      <p><b>Selection is not an argument.</b> It never enters the URL: it is request state, not page state, so a shared link does not carry someone else's selection.</p>`);
}

function pageSettings(){
  return `<div class="stack">${panel({
      leaf:'ingest', title:'Ingest',
      desc:'Every constraint below is declared as data and rendered as an HTML attribute.',
      body:`<form id="settings-form" novalidate><div class="panel-body pad">
          <div class="field-row">
            <div class="field">
              <label class="lbl" for="s-name">Collector name <span class="req">*</span></label>
              <input class="input" id="s-name" name="name" value="eu-north-1" required minlength="3" maxlength="32">
              <div class="hint">Required, 3–32 characters.</div>
            </div>
            <div class="field">
              <label class="lbl" for="s-port">Port <span class="req">*</span></label>
              <input class="input" id="s-port" name="port" type="number" value="8125" required min="1" max="65535">
              <div class="hint">A zero lower bound is a real constraint, so bounds are pointers.</div>
            </div>
          </div>
        </div>
        <div class="panel-foot" style="justify-content:flex-end">
          <button class="btn btn-primary ${canEdit()?'':'disabled gated'}" ${canEdit()?'':`disabled data-why="${GUARD_WHY}"`} type="submit">Save</button>
        </div></form>`,
    })}</div>
    ${NOTE(`<p><b>Submit with an empty name or a port above 65535.</b> The browser refuses before any request — the same rule set the server re-runs after. One declaration, two enforcements.</p>
      <p><b>The toolbar says this page declares no arguments.</b> Absence is the configuration: there is nothing to hide, because there was nothing to declare.</p>`)}`;
}

function pageRetention(){
  return `<div class="stack">${panel({
      leaf:'retention', title:'Retention',
      desc:'A second page under the same nav group.',
      body:`<form id="settings-form" novalidate><div class="panel-body pad">
          <div class="field">
            <label class="lbl" for="s-retain">Retention (days)</label>
            <input class="input" id="s-retain" name="retain" type="number" value="30" min="0" max="365" style="max-width:220px">
            <div class="hint">Optional. Absent means the default, so a zero stays out of the URL.</div>
          </div>
        </div>
        <div class="panel-foot" style="justify-content:flex-end">
          <button class="btn btn-primary ${canEdit()?'':'disabled gated'}" ${canEdit()?'':`disabled data-why="${GUARD_WHY}"`} type="submit">Save</button>
        </div></form>`,
    })}</div>
    ${NOTE(`<p class="flag"><b>This nav group is invented.</b> <code>ir.Nav</code> has <code>Label</code>, <code>Shadow</code> and <code>Hidden</code> — no section and no parent. Grafana's sidebar is two levels deep; webui's is flat. Adding a group is a real decision, not a styling one.</p>`)}`;
}

function pageForbidden(){
  return `<div class="state-page">${svg(I.lock)}
    <p class="state-title">Not permitted</p>
    <p class="state-desc">The page guard ran before anything was loaded, so this device was never read.</p>
    <a class="btn btn-secondary" href="#/device">Back to devices</a>
  </div>`;
}

function pageCompileError(){
  const errs = [
    { where:'page "/device/{id}"  —  DetailsArgs', detail:'the path declares {id} but DetailsArgs has no field for it',
      fix:'Add a field named Id to DetailsArgs, or change the placeholder to match an existing field.' },
    { where:'page "/alert"  —  AlertArgs', detail:'two fields both map to the argument "sev"',
      fix:'Rename one field, or give it a distinct name with a `webui:"..."` tag.' },
    { where:'page "/settings"  —  SettingsArgs', detail:'field Window has unsupported type []string',
      fix:'Arguments must be string, bool, int, int64 or float64 — a URL carries one value per name.' },
  ];
  return `<div class="compile">
    <h2>Failed to compile</h2>
    <p class="count">${errs.length} problems in this app.</p>
    ${errs.map(e=>`<section>
      <div class="where">${esc(e.where)}</div>
      <pre>${esc(e.detail)}</pre>
      <p class="fix"><b>Fix:</b> ${esc(e.fix)}</p>
    </section>`).join('')}
    ${NOTE(`<p><b>Every problem at once, each with a fix.</b> The errors are structured rather than scraped from a compiler, so there is no reason to report them one at a time. This page is served at every path under the prefix until the app compiles.</p>`)}
  </div>`;
}

/* ------------------------------- the router ------------------------------ */
let pending = 0;
async function go(opts = {}){
  const { path, args } = parseURL();

  if(state.broken){
    renderNav(null); $('#crumbs').innerHTML = `<span class="cur">Compile error</span>`;
    $('#toolbar').innerHTML = `<span class="noargs">No app compiled.</span>`;
    setURLBar('GET', path, '500');
    $('#content').innerHTML = pageCompileError();
    return;
  }

  const m = match(path);
  if(!m){ location.hash = '#/device'; return; }
  const { route, params } = m;
  renderNav(route.nav);
  renderCrumbs(route, params);
  renderToolbar(route, args);

  const full = !state.js || opts.full;          // no JS: the browser reloads the page
  const qs = location.hash.split('?')[1];
  const shown = path + (qs ? '?' + qs : '');
  setURLBar('GET', shown, 'page');
  if(full) $('#content').classList.add('fading');

  const n = ++pending;
  await sleep(full ? 240 : 160);
  if(n !== pending) return;                     // a newer navigation won
  $('#content').classList.remove('fading');
  setURLBar('GET', shown);

  if(route.path === '/device')             return void ($('#content').innerHTML = pageDevices(args));
  if(route.path === '/alert')              return void ($('#content').innerHTML = pageAlerts(args));
  if(route.path === '/settings')           return void ($('#content').innerHTML = pageSettings());
  if(route.path === '/settings/retention') return void ($('#content').innerHTML = pageRetention());

  if(route.path === '/device/:id'){
    // The guard sees the decoded arguments and runs before the device is loaded.
    const d = state.devices.find(x => x.id === params.id);
    if(!d || (args.locked === '1' && !canEdit())) return void ($('#content').innerHTML = pageForbidden());
    $('#content').innerHTML = pageDevice(d, args, window.__fieldErr);
    window.__fieldErr = null;
  }
}

/* --------------------------- leaf-level refresh -------------------------- */
function leafHTML(name){
  const { path, args } = parseURL();
  if(name === 'devices') return devicesTable(args);
  if(name === 'alerts')  return alertsTable(args);
  const m = match(path); if(!m) return null;
  const d = state.devices.find(x => x.id === m.params.id);
  if(!d) return null;
  if(name === 'events') return eventsPanel(d);
  if(name === 'form')   return deviceForm(d);
  if(name === 'raw')    return rawPanel(d);
  return null;
}
// With JS on, a control belonging to a leaf refreshes that leaf. The link is
// the same link; only the amount re-rendered differs.
async function refreshLeaf(name, cols){
  const el = document.querySelector(`[data-leaf="${name}"]`);
  const html = leafHTML(name);
  if(!el || !html) return go();
  const tb = el.querySelector('tbody');
  if(tb) tb.innerHTML = skeletonRows(cols || 5);
  setURLBar('GET', location.hash.replace('#',''), `leaf ${name}`);
  await sleep(230);
  const cur = document.querySelector(`[data-leaf="${name}"]`);
  if(cur) cur.outerHTML = leafHTML(name);
  setURLBar('GET', location.hash.replace('#',''));
}
const LEAF_COLS = { devices:6, alerts:5, events:3, form:0, raw:0 };

/* ------------------------------ interactions ----------------------------- */
document.addEventListener('click', async e => {
  // collapsible row (Grafana's row header)
  const rh = e.target.closest('.rowhead');
  if(rh){
    const id = rh.dataset.row;
    state.closed.has(id) ? state.closed.delete(id) : state.closed.add(id);
    rh.classList.toggle('closed');
    document.querySelector(`[data-rowbody="${id}"]`).classList.toggle('closed');
    return;
  }
  // nav group
  const grp = e.target.closest('[data-group]');
  if(grp){
    grp.classList.toggle('open');
    document.querySelector(`[data-sub="${grp.dataset.group}"]`).classList.toggle('open');
    return;
  }
  if(!e.target.closest('#search') && !e.target.closest('#palette')) $('#palette').classList.remove('open');

  const pal = e.target.closest('.pal-item');
  if(pal){ location.hash = pal.dataset.href; $('#palette').classList.remove('open'); $('#q-global').value=''; return; }

  const x = e.target.closest('[data-clear]');
  if(x){ location.hash = here({[x.dataset.clear]:'', offset:0}).slice(1); return; }

  const rowEl = e.target.closest('tr.clickable');
  if(rowEl && !e.target.closest('input')){ location.hash = rowEl.dataset.href.slice(1); return; }

  const btn = e.target.closest('[data-act]');
  if(!btn) return;
  const act = btn.dataset.act;

  if(act === 'panel-menu'){ const n = btn.dataset.leaf; if(n) return refreshLeaf(n, LEAF_COLS[n]); return; }
  if(act === 'refresh-menu'){ toast('Auto-refresh', 'Not a webui concept — a control plane refreshes a leaf on demand, it does not poll.'); return; }
  if(act === 'refresh-page'){
    const leaves = [...document.querySelectorAll('[data-leaf]')].map(el => el.dataset.leaf).filter(Boolean);
    return void await Promise.all(leaves.map(n => refreshLeaf(n, LEAF_COLS[n])));
  }
  if(act === 'refresh-events'){ e.preventDefault(); return refreshLeaf('events', 3); }
  if(act === 'clearsel'){ e.preventDefault(); state.selection.clear(); return refreshLeaf('alerts', 5); }

  if(act === 'ack' || act === 'dismiss'){
    if(!canEdit()) return;                        // the guard, again, on execution
    const ids = [...state.selection];
    setURLBar('POST', location.hash.replace('#',''), 'action');
    await sleep(320);
    ids.forEach(id => { const a = ALERTS.find(x=>x.id===id); if(a) act==='ack' ? a.ack = true : a.dismissed = true; });
    if(act === 'dismiss') for(let i=ALERTS.length-1;i>=0;i--) if(ALERTS[i].dismissed) ALERTS.splice(i,1);
    state.selection.clear();
    toast(act==='ack' ? `${ids.length} alert(s) acknowledged` : `${ids.length} alert(s) dismissed`,
          'Effect returned a toast; the leaf reloaded.');
    renderNav('alerts');
    return refreshLeaf('alerts', 5);
  }
});

document.addEventListener('change', e => {
  const v = e.target.dataset && e.target.dataset.var;
  if(v){ location.hash = here({[v]: e.target.value, offset:0}).slice(1); return; }
  if(e.target.id === 'pickall'){
    const args = parseURL().args;
    const rows = ALERTS.filter(a => (!args.sev || a.severity === args.sev) &&
      (!args.state || (args.state === 'acknowledged' ? a.ack : !a.ack)));
    state.selection = e.target.checked ? new Set(rows.map(r=>r.id)) : new Set();
    return refreshLeaf('alerts', 5);
  }
  if(e.target.classList.contains('pick1')){
    e.target.checked ? state.selection.add(e.target.value) : state.selection.delete(e.target.value);
    return refreshLeaf('alerts', 5);
  }
});

/* text variables navigate, debounced; the URL stays the single source of truth */
let qt;
document.addEventListener('input', e => {
  if(e.target.id === 'q-global'){
    const q = e.target.value.toLowerCase();
    const hits = ROUTES.filter(r => !r.shadow && (r.title + ' ' + (r.group||'')).toLowerCase().includes(q));
    $('#palette').innerHTML = `<div class="pal-label">Pages</div>` + (hits.length
      ? hits.map(r => `<div class="pal-item" data-href="${r.path}">
          <span>${r.group ? esc(r.group) + ' / ' : ''}${esc(r.title)}</span><span class="mono">${esc(r.path)}</span></div>`).join('')
      : `<div class="pal-empty">Nothing matches. The list is the compiled app's pages — there is no index to fall out of date.</div>`);
    $('#palette').classList.add('open');
    return;
  }
  const v = e.target.dataset && e.target.dataset.var;
  if(!v || e.target.tagName !== 'INPUT') return;
  clearTimeout(qt);
  const val = e.target.value;
  qt = setTimeout(() => {
    history.replaceState(null, '', here({[v]: val, offset:0}));
    renderToolbar(match(parseURL().path).route, parseURL().args);
    const box = document.querySelector(`[data-var="${v}"]`);
    if(box){ box.focus(); box.setSelectionRange(box.value.length, box.value.length); }
    refreshLeaf('devices', 6);
  }, 260);
});

document.addEventListener('submit', async e => {
  e.preventDefault();
  const form = e.target;

  // 1. the declared rules, enforced by the browser before anything is sent
  if(!form.checkValidity()){
    [...form.elements].forEach(el => {
      if(el.willValidate && !el.checkValidity()){
        el.classList.add('invalid');
        let m = el.parentElement.querySelector('.err');
        if(!m){ m = document.createElement('div'); m.className = 'err'; el.parentElement.appendChild(m); }
        m.innerHTML = svg(I.alert) + esc(el.validationMessage);
      }
    });
    toast('Not submitted', 'The browser rejected it from the declared rules.', 'err');
    return;
  }

  if(form.id === 'settings-form'){
    setURLBar('POST', location.hash.replace('#',''), 'submit');
    await sleep(380); setURLBar('GET', location.hash.replace('#',''));
    toast('Saved', 'Effect returned a toast and stayed on the page.');
    return;
  }

  // 2. the server sees the whole model: uniqueness needs the service
  const { params } = match(parseURL().path);
  const d = state.devices.find(x => x.id === params.id);
  const ip = form.elements.ip.value.trim();
  setURLBar('POST', location.hash.replace('#',''), 'submit');
  await sleep(420);
  setURLBar('GET', location.hash.replace('#',''));

  if(TAKEN_IPS.has(ip) && ip !== d.ip){
    // Effect.Fields with a nil error: understood, refused, and fixable.
    const wrap = document.querySelector('[data-leaf="form"]');
    wrap.outerHTML = deviceForm({ ...d, ip }, { field:'ip', message:'already in use by another device' });
    toast('Could not save', '1 field needs attention.', 'err');
    return;
  }

  d.ip = ip; d.site = form.elements.site.value;
  toast('Device saved', 'Effect redirected back to Devices.');
  location.hash = '#/device';                     // Effect{Toast, Redirect}
});

/* ------------------------------- switches -------------------------------- */
$('#role-sw').addEventListener('change', e => {
  state.role = e.target.checked ? 'editor' : 'viewer';
  e.target.closest('.side-row').querySelector('span').textContent = 'Role: ' + state.role;
  go();
});
$('#js-sw').addEventListener('change', e => {
  state.js = e.target.checked;
  toast(state.js ? 'JavaScript on' : 'JavaScript off',
        state.js ? 'Panel-level refresh over the same links.' : 'Every link now reloads the whole page.');
  go();
});
$('#theme-sw').addEventListener('change', e => {
  document.documentElement.dataset.theme = e.target.checked ? 'light' : 'dark';
});
$('#broken-sw').addEventListener('change', e => { state.broken = e.target.checked; go(); });

document.addEventListener('keydown', e => {
  if((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k'){ e.preventDefault(); $('#q-global').focus(); }
  if(e.key === 'Escape') $('#palette').classList.remove('open');
});

window.addEventListener('hashchange', () => go());
if(!location.hash) location.hash = '#/device';
go();
</script>
</body>
</html>
